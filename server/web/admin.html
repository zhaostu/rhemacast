<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rhemacast admin</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:12px;max-width:560px;margin-inline:auto}
h1{font-size:1.2rem;margin:.4rem 0}
.card{background:#1c1c1c;border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.dot{width:26px;height:26px;border-radius:50%;background:#555;flex:none}
.dot.live{background:#2ecc40;box-shadow:0 0 12px #2ecc40}
#state{font-size:1.4rem;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
button{font-size:1.1rem;padding:14px;border:0;border-radius:10px;background:#2a6df4;color:#fff}
button.warn{background:#b3541e}button.danger{background:#b32b2b}button:active{filter:brightness(1.2)}
#meter{height:26px;background:#333;border-radius:8px;overflow:hidden;margin-top:8px}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#2ecc40,#ffdc00 70%,#ff4136)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:1rem}
.grid b{font-variant-numeric:tabular-nums}
label{font-size:.85rem;color:#aaa}input{width:100%;font-size:1rem;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;margin:4px 0 8px}
#msg{min-height:1.4em;font-size:.9rem;color:#ffb}pre{background:#000;border-radius:8px;padding:10px;max-height:300px;overflow:auto;font-size:.75rem;white-space:pre-wrap}
details summary{font-size:1.05rem;padding:8px 0;cursor:pointer}
</style>
</head>
<body>
<h1>&#127897; rhemacast admin</h1>
<div class="card">
  <div class="row"><div id="dot" class="dot"></div><div id="state">…</div></div>
  <div class="btns">
    <button id="bStart">▶ Start</button>
    <button id="bRestart" class="warn">↻ Restart</button>
    <button id="bStop" class="danger">■ Stop</button>
  </div>
  <div id="msg"></div>
</div>
<div class="card">
  <label>Mic level (live)</label>
  <div id="meter"><div id="bar"></div></div>
</div>
<div class="card grid">
  <span>Listeners</span><b id="sList">…</b>
  <span>Uptime</span><b id="sUp">…</b>
  <span>CPU temp</span><b id="sTemp">…</b>
  <span>Version</span><b id="sVer">…</b>
</div>
<div class="card">
  <details id="logBox">
    <summary>Log tail (publish service)</summary>
    <div class="row"><button id="bLogs" style="flex:1">↻ Refresh logs</button></div>
    <pre id="logs">tap Refresh…</pre>
  </details>
</div>
<div class="card">
  <label>Server (IP/hostname, auto from URL)</label>
  <input id="host" placeholder="192.168.4.1">
  <label>Bearer token (stored on this device only)</label>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN (optional)" autocomplete="off">
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const hostEl=$("host"),tokEl=$("tok");
hostEl.value=localStorage.getItem("rh_host")||location.hostname||"";
tokEl.value=localStorage.getItem("rh_token")||"";
hostEl.onchange=()=>localStorage.setItem("rh_host",hostEl.value.trim());
tokEl.onchange=()=>localStorage.setItem("rh_token",tokEl.value.trim());
const base=()=>`http://${(hostEl.value.trim()||location.hostname)}:8080`;
const hdrs=()=>{const t=tokEl.value.trim();return t?{Authorization:"Bearer "+t}:{};};
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),...hdrs()};
  const r=await fetch(base()+path,opt);
  if(r.status===401)throw new Error("unauthorized: check token");
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
const fmtUp=s=>s<0?"n/a":`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
async function pollStatus(){
  try{
    const s=await api("/api/status");
    $("dot").className="dot"+(s.publishing?" live":"");
    $("state").textContent=s.publishing?"● LIVE":"○ STOPPED";
    $("sList").textContent=s.listeners<0?`n/a (${s.listeners_note||"?"})`:s.listeners;
    $("sUp").textContent=fmtUp(s.uptime_s);
    $("sTemp").textContent=s.cpu_temp_c==null?"n/a":s.cpu_temp_c.toFixed(1)+" °C";
    $("sVer").textContent=s.version||"";
  }catch(e){$("state").textContent="⚠ "+e.message;}
}
async function pollLevel(){
  try{
    const l=await api("/api/level");
    $("bar").style.width=(l.peak<0?0:l.peak*100).toFixed(1)+"%";
  }catch(e){/* keep last bar on error */}
}
async function act(a){
  $("msg").textContent=a+"…";
  try{const r=await api("/api/publish/"+a,{method:"POST"});
    $("msg").textContent=(r.ok?"OK: ":"FAILED: ")+(r.output||"").slice(-160);
    pollStatus();
  }catch(e){$("msg").textContent="⚠ "+e.message;}
}
async function logs(){
  $("logs").textContent="loading…";
  try{const r=await api("/api/logs?lines=50");
    $("logs").textContent=(r.lines||[]).join("\n")||"(empty: "+(r.note||r.source)+")";
  }catch(e){$("logs").textContent="⚠ "+e.message;}
}
$("bStart").onclick=()=>act("start");
$("bStop").onclick=()=>act("stop");
$("bRestart").onclick=()=>act("restart");
$("bLogs").onclick=logs;
$("logBox").ontoggle=e=>{if(e.target.open)logs();};
pollStatus();pollLevel();
setInterval(pollStatus,3000);
setInterval(pollLevel,500);
</script>
</body>
</html>

[package]
name = "rhemacast-server"
version = "0.1.0"
edition = "2021"
description = "rhemacast translator broadcast — single binary: mic/tone -> Opus -> WebRTC fan-out + admin API + web UI"

[[bin]]
name = "rhemacastd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bytes = "1"
cpal = "0.18"
audiopus = "0.2"
webrtc = "0.17"
